<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel WGP</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/panel/panel.css"><script src="/panel/panel.js" defer></script></head><body><a class="skip" href="#content">Przejdź do treści</a><div id="app"><p class="loading">Otwieram panel WGP…</p></div><div id="toast" role="status" aria-live="polite" hidden></div><dialog id="media-dialog" aria-labelledby="media-title"><div class="dialog-top"><div><span class="eyebrow">BIBLIOTEKA</span><h2 id="media-title">Wybierz zdjęcie</h2></div><button type="button" class="icon-button" data-action="close-media" aria-label="Zamknij bibliotekę">×</button></div><p>Wybierz zdjęcie ze strony albo prześlij własne.</p><div class="toolbar"><label class="search-label">Szukaj zdjęcia<input type="search" id="media-search" placeholder="Nazwa zdjęcia…"></label><label class="button secondary upload-label">Dodaj zdjęcie<input type="file" id="image-upload" accept="image/jpeg,image/png,image/webp"></label></div><p id="media-message" role="status"></p><div id="media-grid"></div></dialog><dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">Opublikować zmiany?</h2><p>Po publikacji zobaczą je osoby odwiedzające stronę.</p><div id="publish-summary"></div><div class="actions"><button type="button" class="button secondary" data-action="cancel-publish">Wróć do edycji</button><button type="button" class="button" data-action="confirm-publish">Tak, opublikuj</button></div></dialog></body></html>
